name: Strategy builder checks
on:
  pull_request:
    paths:
      - "backend/edwinStrategy.ts"
      - "backend/strategyBuilder.ts"
      - "src/components/StrategyBuilder.tsx"
      - "src/App.tsx"
      - "src/dashboard.css"
      - "server.ts"
      - "tests/edwinStrategy.test.ts"
      - ".github/workflows/strategy-builder.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
