name: Strategy builder checks
on:
  pull_request:
    paths:
      - "backend/edwinStrategy.ts"
      - "backend/strategyBuilder.ts"
      - "backend/evTestRouting.ts"
      - "backend/hookMarketFeed.ts"
      - "backend/formationState.ts"
      - "backend/trading.ts"
      - "backend/config.ts"
      - "src/components/StrategyBuilder.tsx"
      - "src/App.tsx"
      - "src/dashboard.css"
      - "server.ts"
      - "tests/edwinStrategy.test.ts"
      - "tests/evTestRouting.test.ts"
      - "tests/hookMarketFeed.test.ts"
      - "deploy/install-krystian.sh"
      - "deploy/update-krystian.sh"
      - "Dockerfile"
      - ".github/workflows/strategy-builder.yml"
      - "deploy/migrate-evgen-to-mon.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: bash -n deploy/migrate-evgen-to-mon.sh deploy/install-krystian.sh deploy/update-krystian.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
